*,*::before,*::after{box-sizing:inherit}

.aurora i{position:absolute;border-radius:50%}
.aurora i:nth-child(1){width:46vw;height:46vw;max-width:620px;max-height:620px;background:var(--glow1);top:0;right:8%;opacity:.45;animation:drift1 22s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:38vw;height:38vw;max-width:520px;max-height:520px;background:var(--glow2);top:8%;left:6%;opacity:.35;animation:drift2 26s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:30vw;height:30vw;max-width:420px;max-height:420px;background:var(--glow3);top:22%;left:38%;opacity:.25;animation:drift3 30s ease-in-out infinite alternate}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--canvas) 78%,transparent);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}

.ring{position:relative;width:132px;height:132px}

.k-bagrut{--c:var(--bagrut);--soft:var(--bagrut-s)} .k-mock{--c:var(--mock);--soft:var(--mock-s)} .k-exam{--c:var(--exam);--soft:var(--exam-s)} .k-event{--c:var(--event);--soft:var(--event-s)} .k-hol{--c:var(--hol);--soft:var(--hol-s)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 15px;overflow:hidden}
.stat::after{content:"";position:absolute;inset-inline-end:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:var(--soft,var(--line2));opacity:.8}

.year{padding:16px 18px 20px}

.banner{position:relative;display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:var(--r-lg);background:linear-gradient(120deg,#13214A,#2A2F8C 55%,#0D5E52);color:#fff;margin-bottom:18px;overflow:hidden}

.banner b{display:block;font-size:16px}

.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line2)}

.calbtns{display:grid;gap:8px}

.danger-zone{display:flex;gap:8px;flex-wrap:wrap}

#onb{width:min(560px,calc(100% - 24px))}

.tile:hover{border-color:var(--bagrut);transform:translateY(-2px)}
.tile[aria-pressed="true"]{border-color:var(--bagrut);background:var(--bagrut-s);box-shadow:0 0 0 3px color-mix(in srgb,var(--bagrut) 22%,transparent)}
.onb .foot{display:flex;gap:8px;align-items:center;margin-top:20px}
.onb .foot .btn.glow{margin-inline-start:auto}
.slide{animation:slidein .35s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{opacity:0;transform:translateX(-24px)}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px) scale(.96);opacity:0;background:var(--ink);color:var(--canvas);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:60;pointer-events:none;transition:all .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 14px 34px rgba(0,0,0,.28);max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
dialog{border:0;border-radius:var(--r-xl);padding:0;background:var(--surface);color:var(--ink);width:min(440px,calc(100% - 28px));box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog[open]{animation:dlg .3s cubic-bezier(.2,.8,.2,1)}
@keyframes dlg{from{opacity:0;transform:translateY(16px) scale(.97)}}
dialog::backdrop{background:rgba(6,12,24,.5);backdrop-filter:blur(3px)}
.dlg-h{display:flex;align-items:center;padding:16px 18px 0}
.dlg-h h3{margin:0;font-size:17px;flex:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.skel{height:140px;border-radius:var(--r-xl);background:linear-gradient(90deg,var(--line2),var(--surface),var(--line2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.intro > *{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.intro > *:nth-child(2){animation-delay:.06s}.intro > *:nth-child(3){animation-delay:.12s}.intro > *:nth-child(4){animation-delay:.18s}.intro > *:nth-child(5){animation-delay:.24s}.intro > *:nth-child(6){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
footer.ft{max-width:1000px;margin:0 auto;padding:0 18px 40px;color:var(--faint);font-size:13px}
@media (max-width:760px){

  .kpis{grid-template-columns:repeat(2,1fr)}

@media (max-width:420px){.stat b{font-size:23px}.stat{padding:11px}.day{grid-template-columns:46px 1fr;padding:12px 14px}.cls{margin-inline-start:0;width:100%}.live div{min-width:38px}}
/* ===== v2 design layer ===== */
:root{--grad:linear-gradient(135deg,var(--bagrut),#7A5CFF 55%,var(--exam))}
.sprog{position:absolute;inset-inline-start:0;bottom:-1px;height:2px;width:0;background:var(--grad);border-radius:2px;transition:width .1s linear}
/* spotlight that follows the pointer on cards */
.spot{position:relative}
.spot::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--k,var(--bagrut)) 10%,transparent),transparent 45%);z-index:0}
@media (hover:hover){.spot:hover::before{opacity:1}}
/* ticket */
.ticket{background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(from var(--ang,0deg),color-mix(in srgb,var(--k,var(--bagrut)) 70%,transparent),var(--line) 25%,var(--line) 60%,color-mix(in srgb,var(--k,var(--bagrut)) 70%,transparent)) border-box;border:1.5px solid transparent;animation:spin 8s linear infinite}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--ang:360deg}}
.ticket::before{width:0}
.t-main,.t-side{position:relative;z-index:1}
.t-side{background:color-mix(in srgb,var(--k,var(--sunk)) 6%,var(--sunk))}
.t-side::before,.t-side::after{border-color:transparent}
.ticket.is-today .ring{animation:beat 2.4s ease-in-out infinite}
.ticket.is-today .t-num{font-size:40px}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.ring::after{content:"";position:absolute;inset:14px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--k,var(--bagrut)) 16%,transparent),transparent);z-index:-1}
.t-date{margin-top:12px;text-align:center;font-size:13px;color:var(--muted);font-weight:600}
.live div{position:relative;overflow:hidden}
.live b.flip{animation:flip .35s ease}
@keyframes flip{from{transform:translateY(-40%);opacity:.2}}
.luck{margin-top:12px;font-weight:700;color:var(--k,var(--ok));display:flex;align-items:center;gap:6px}
/* stats */
.stats{gap:12px}
.stat{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-lg);transition:transform .25s,box-shadow .25s}
.stat::after{display:none}
.stat .si{width:42px;height:42px;border-radius:13px;background:var(--soft);color:var(--c);display:grid;place-items:center;flex:none}
.stat .si svg{width:20px;height:20px}
.stat > div{min-width:0}
@media (hover:hover){.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}}
/* this-week strip */
.week{margin:0 0 14px}
.week-h{display:flex;align-items:baseline;gap:10px;margin:2px 2px 10px}
.week-h h2{font:700 21px var(--serif);margin:0}
.week-h span{color:var(--muted);font-size:13px}
.wstrip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;scrollbar-width:none}
.wstrip::-webkit-scrollbar{display:none}
.wc{scroll-snap-align:start;flex:0 0 200px;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:12px 14px 14px;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s;color:var(--ink)}
.wc::before{content:"";position:absolute;inset-block-start:0;inset-inline:0;height:4px;background:var(--c)}
@media (hover:hover){.wc:hover{transform:translateY(-3px);box-shadow:var(--shadow-h);border-color:color-mix(in srgb,var(--c) 40%,var(--line))}}
.wc .wd2{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600}
.wc .wd2 b{font:700 22px/1 var(--sans);color:var(--ink);font-variant-numeric:tabular-nums}
.wc .wt{display:block;font-weight:700;font-size:15px;margin:8px 0 6px;line-height:1.3}
.wc .wx{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.wc.hot .when2{color:var(--urgent)}
.when2{font-size:12px;font-weight:700}
.wfree{flex:1;border:1px dashed var(--line);border-radius:var(--r-lg);padding:16px;color:var(--muted);text-align:center;background:color-mix(in srgb,var(--surface) 60%,transparent)}
/* year track */
.track{height:12px}
.track .tk{width:11px;height:11px;transition:transform .2s}
.track .tk:hover{transform:translate(50%,-50%) scale(1.6)}
.track .now{top:-30px;background:var(--urgent);color:#fff;padding:2px 8px;border-radius:999px;font-size:11px;box-shadow:0 4px 12px -4px var(--urgent)}
.track .now::after{top:100%;height:14px;width:2px}
.track .now::before{content:"";position:absolute;left:50%;top:calc(100% + 13px);width:10px;height:10px;border-radius:50%;background:var(--urgent);transform:translateX(-50%);animation:ping 2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--urgent) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.year .hd{margin-bottom:30px}
/* banner */
.banner{background:linear-gradient(120deg,#13214A,#2A2F8C 35%,#5B3FD1 55%,#0D5E52 80%,#13214A);background-size:300% 100%;animation:pan 14s ease-in-out infinite alternate}
@keyframes pan{to{background-position:100% 0}}
/* buttons */
.btn.glow{position:relative;overflow:hidden}
.btn.glow::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(120%);transition:transform .7s}
.btn.glow:hover::after{transform:translateX(-120%)}
/* list */
.list .mo{font-size:22px;padding:14px 18px 10px}
.list .mo small{background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-weight:600}
.day{grid-template-columns:62px 1fr;gap:16px;padding:14px 18px;align-items:start;position:relative}
.dn{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);padding:0;box-shadow:0 1px 2px rgba(13,24,48,.04)}
.dn i{display:block;background:var(--sunk);border-bottom:1px solid var(--line2);font-size:11.5px;padding:3px 0}
.dn b{font-size:22px;padding:6px 0 7px}
.day.today .dn{border-color:var(--urgent)}
.day.today .dn i{background:var(--urgent);color:#fff;border-color:var(--urgent)}
.day.sat .dn i{color:var(--event)}
.day.today{background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--urgent) 8%,transparent))}
.day.today::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;background:var(--urgent)}
.it{gap:6px 10px;padding:5px 0}
.it .bar{display:none}
.it .tt{font-size:16px}
.cls{margin-inline-start:0}
.cls span{background:var(--sunk);border-color:var(--line2)}
.soon{background:color-mix(in srgb,var(--urgent) 12%,transparent);padding:0 8px;border-radius:999px;font-size:12px}
.day.hl{animation:hl 1.6s ease}
@keyframes hl{0%,40%{background:color-mix(in srgb,var(--bagrut) 14%,transparent)}}
/* month grid */
.cell{border-radius:14px}
@media (hover:hover){.cell:not(.out):hover{transform:translateY(-2px);box-shadow:var(--shadow)}}
/* back to top */
.totop{position:fixed;inset-inline-start:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(10px);box-shadow:var(--shadow);display:grid;place-items:center;z-index:25;opacity:0;transform:translateY(16px) scale(.9);pointer-events:none;transition:all .3s cubic-bezier(.2,.8,.2,1)}
.totop.on{opacity:1;transform:none;pointer-events:auto}
.totop svg{width:20px;height:20px;transform:rotate(-90deg)}
/* personal area */
.prof{position:relative;margin:4px 0 16px;padding:22px;border-radius:var(--r-xl);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;isolation:isolate;flex-wrap:wrap}
.prof::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(500px 200px at 90% -20%,color-mix(in srgb,var(--glow1) 35%,transparent),transparent 70%),radial-gradient(400px 200px at 0% 120%,color-mix(in srgb,var(--glow2) 30%,transparent),transparent 70%)}
.prof .pstats{display:flex;gap:8px;margin-inline-start:auto;flex-wrap:wrap}
.prof .pstats div{background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--line);border-radius:14px;padding:8px 14px;text-align:center;min-width:86px;backdrop-filter:blur(6px)}
.prof .pstats b{display:block;font:700 22px/1.1 var(--sans);font-variant-numeric:tabular-nums}
.prof .pstats span{font-size:12px;color:var(--muted)}
.avatar{animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.card{transition:box-shadow .25s}
.task{border-radius:12px;transition:background .2s}
.task:hover{background:var(--sunk)}
.task .when{border:1px solid var(--line);border-radius:12px;padding:4px 0;background:var(--surface)}
.chan{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:6px}
.chb{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 12px;text-align:start;font-weight:600;font-size:14px;transition:all .2s;position:relative}
.chb .ci{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);font-size:17px;flex:none;transition:transform .3s}

    if(!was){const r=b.getBoundingClientRect();const all=keys.every(x=>S.prep.has(x));confetti(r.left+r.width/2,r.top+r.height/2,all?160:40);toast(all?'מוכנים לכל המבחנים הקרובים! 🏆':'כל הכבוד!')}
    drawMe()});
  app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{const d=+b.dataset.rm;const set=new Set(S.me.remind);set.has(d)?set.delete(d):set.add(d);b.setAttribute('aria-checked',set.has(d));if(await patchMe({remind:[...set]},set.size?'התזכורות עודכנו':'לא יישלחו תזכורות'))drawMe()});
  app.querySelector('[data-pause]').onclick=async()=>{if(await patchMe({paused:!S.me.paused},!S.me.paused?'התזכורות הושהו':'התזכורות הופעלו'))drawMe()};
  let pc=me.cls;const pmj=[...mj];const pf=$('#pf');bindPicker(pf,c=>pc=c);bindMj(pf,pmj);
  pf.onsubmit=async e=>{e.preventDefault();const name=$('#pn').value.trim();if(name.length<2){toast('צריך שם של לפחות 2 אותיות');return}if(await patchMe({name,cls:pc,majors:pmj},'הפרטים נשמרו')){S.cls=pc;S.majors=pmj;LS.set('yb.clsManual',false);save();drawMe()}};
  app.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy));
  app.querySelector('[data-logout]').onclick=()=>{logout();toast('יצאת מהאזור האישי');route()};
  app.querySelector('[data-del]').onclick=async()=>{if(!confirm('למחוק את ההרשמה? לא יישלחו יותר תזכורות.'))return;try{await api('/api/me?t='+encodeURIComponent(S.token),{method:'POST',body:{action:'delete'}});logout();toast('ההרשמה נמחקה');location.hash='#/'}catch(e){toast('המחיקה נכשלה. נסו שוב.')}};
}
function logout(silent){S.token=null;S.me=null;LS.del('yb.token');LS.del('yb.me');updateNav();if(silent)renderLogin()}
let ADM=null;
async function renderAdmin(){
  if(S.token&&!S.me){app.innerHTML='<div class="skel"></div>';try{const j=await api('/api/me?t='+encodeURIComponent(S.token));S.me=j.sub;LS.set('yb.me',S.me);updateNav()}catch(e){}}
  if(!S.token||!S.me||!S.me.isAdmin){app.innerHTML=`<div class="empty"><b style="display:block;font-size:18px;color:var(--ink);margin-bottom:6px">הדף הזה למנהלים בלבד</b>צריך להיכנס לאזור האישי עם מייל של מנהל.<div style="margin-top:14px"><a class="btn" href="#/me">לאזור האישי</a></div></div>`;return}
  app.innerHTML='<div class="skel"></div>';
  try{ADM=await api('/api/admin?t='+encodeURIComponent(S.token));drawAdmin()}
  catch(e){app.innerHTML=`<div class="empty">${e.status===403?'אין הרשאת ניהול לחשבון הזה.':'לא הצלחנו לטעון את הנתונים. נסו לרענן.'}</div>`}
}
function drawAdmin(q='',fc='all'){
  const subs=ADM.subs,tot=subs.length,paused=subs.filter(s=>s.paused).length;
  const byCls=CLASSES.map(c=>[c,subs.filter(s=>s.cls===c).length]);
  const byMj=Object.keys(MAJORS).map(m=>[m,subs.filter(s=>(s.majors||[]).includes(m)).length]);
  const max=a=>Math.max(1,...a.map(x=>x[1]));
  const weekNew=subs.filter(s=>Date.now()-Date.parse(s.createdAt)<7*864e5).length;
  const sent14=ADM.preview.reduce((a,p)=>a+p.count,0);
  app.innerHTML=`<div class="intro">
    <div><h1 class="h-page">דף <span class="grad">הניהול</span></h1><p class="lead">כל הנרשמים, התזכורות הקרובות וכלים לבדיקה.</p></div>
    <div class="kpis"><div class="stat k-bagrut"><b data-c="${tot}">0</b><span>נרשמים</span></div><div class="stat k-exam"><b data-c="${weekNew}">0</b><span>חדשים השבוע</span></div><div class="stat k-mock"><b data-c="${sent14}">0</b><span>מיילים בשבועיים הקרובים</span></div><div class="stat k-event"><b data-c="${paused}">0</b><span>השהו תזכורות</span></div></div>
    <div class="me-grid" style="margin-bottom:16px">
      <div>
        <section class="card"><div class="card-h"><h2>תזכורות שייצאו בשבועיים הקרובים</h2></div><div class="card-b">${ADM.preview.length?`<div class="prev">${ADM.preview.map(p=>`<div class="p"><b>${p.count}</b><div><div style="font-weight:600">${diff(p.date)===0?'היום':diff(p.date)===1?'מחר':'יום '+WD[dt(p.date).getDay()]+', '+pretty(p.date)}</div><span>${p.subjects.map(esc).join(' · ')}</span></div></div>`).join('')}</div>`:'<div class="empty" style="padding:16px 0">אין תזכורות מתוכננות בשבועיים הקרובים.</div>'}</div></section>
      </div>
      <div>
        <section class="card"><div class="card-h"><h2>לפי כיתה</h2></div><div class="card-b bars">${byCls.map(([c,n])=>`<div class="b"><span>${c}</span><div class="t"><i data-w="${n/max(byCls)*100}"></i></div><b>${n}</b></div>`).join('')}</div></section>
        <section class="card"><div class="card-h"><h2>לפי מגמה</h2></div><div class="card-b bars">${byMj.map(([m,n])=>`<div class="b"><span>${MAJORS[m][1]} ${MAJORS[m][0]}</span><div class="t"><i data-w="${n/max(byMj)*100}"></i></div><b>${n}</b></div>`).join('')}</div></section>
        <section class="card"><div class="card-b" style="display:grid;gap:8px"><button class="btn" type="button" data-test>${ICON.send}שליחת מייל תזכורת לדוגמה אליי</button><button class="btn" type="button" data-csv>${ICON.download}הורדת הנרשמים לאקסל</button><button class="btn ghost" type="button" data-reload>רענון הנתונים</button></div></section>
      </div>
    </div>
    <section class="card"><div class="card-h"><h2>הנרשמים</h2><span class="sub" id="cnt"></span></div>
      <div class="adm-tools"><input class="input" id="aq" placeholder="חיפוש לפי שם או מייל" value="${esc(q)}"><select id="ac" aria-label="סינון לפי כיתה"><option value="all">כל הכיתות</option>${CLASSES.map(c=>`<option ${fc===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="tblw"><table class="tbl"><thead><tr><th>שם</th><th>כיתה</th><th>מגמות</th><th>מייל</th><th>תזכורות</th><th>נרשם</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
    </section></div>`;
  app.querySelectorAll('.stat b[data-c]').forEach(b=>countUp(b,+b.dataset.c));
  requestAnimationFrame(()=>requestAnimationFrame(()=>app.querySelectorAll('.bars i').forEach(i=>i.style.width=i.dataset.w+'%')));
  const rtxt=s=>s.paused?'מושהה':[...(s.remind||[])].sort((a,b)=>b-a).map(d=>d===1?'יום':d===7?'שבוע':d+' ימים').join(', ')||'ללא';
  const fill=()=>{
    const qq=$('#aq').value.trim().toLowerCase(),cc=$('#ac').value;
    const rows=subs.filter(s=>(cc==='all'||s.cls===cc)&&(!qq||s.name.toLowerCase().includes(qq)||s.email.toLowerCase().includes(qq))).sort((a,b)=>a.cls.localeCompare(b.cls)||a.name.localeCompare(b.name,'he'));
    $('#cnt').textContent=`${rows.length} מתוך ${tot}`;
    $('#tb').innerHTML=rows.map(s=>`<tr><td style="font-weight:600">${esc(s.name)}</td><td>${s.cls}</td><td>${(s.majors||[]).map(m=>MAJORS[m]?MAJORS[m][1]:'').join(' ')||'<span style="color:var(--faint)">—</span>'}</td><td dir="ltr" style="text-align:right">${esc(s.email)}</td><td>${rtxt(s)}</td><td>${new Date(s.createdAt).toLocaleDateString('he-IL')}</td><td><button class="icbtn" type="button" data-delid="${s.id}" aria-label="מחיקת ${esc(s.name)}">${ICON.trash}</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">אין נרשמים שמתאימים לחיפוש.</td></tr>';
    $('#tb').querySelectorAll('[data-delid]').forEach(b=>b.onclick=async()=>{const s=subs.find(x=>x.id===b.dataset.delid);if(!confirm(`למחוק את ${s.name}?`))return;try{await api('/api/admin?t='+encodeURIComponent(S.token),{method:'POST',body:{action:'delete',id:s.id}});ADM.subs=subs.filter(x=>x.id!==s.id);toast('נמחק');drawAdmin($('#aq').value,$('#ac').value)}catch(e){toast('המחיקה נכשלה')}});
  };
  fill();$('#aq').oninput=fill;$('#ac').onchange=fill;
  app.querySelector('[data-test]').onclick=async e=>{const b=e.currentTarget;b.disabled=true;try{await api('/api/admin?t='+encodeURIComponent(S.token),{method:'POST',body:{action:'test'}});toast('נשלח! בדוק את המייל שלך')}catch(x){toast(x.message==='no_exams'?'אין מבחנים קרובים לשלוח עליהם':'השליחה נכשלה')}b.disabled=false};
  app.querySelector('[data-csv]').onclick=()=>{const rows=[['שם','כיתה','מגמות','מייל','תזכורות','נרשם'],...subs.map(s=>[s.name,s.cls,(s.majors||[]).map(m=>MAJORS[m]?MAJORS[m][0]:m).join(' / '),s.email,rtxt(s),s.createdAt.slice(0,10)])];const csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='nirshamim.csv';a.click();toast('הקובץ ירד')};
  app.querySelector('[data-reload]').onclick=renderAdmin;
}
window.addEventListener('hashchange',route);
const sprog=$('#sprog'),totop=$('#totop');totop.innerHTML=ICON.prev;totop.onclick=()=>scrollTo({top:0,behavior:RM?'auto':'smooth'});
const topEl=$('.top'),aur=$('.aurora');let sTick=false;
const onScroll=()=>{if(sTick)return;sTick=true;requestAnimationFrame(()=>{sTick=false;const h=document.documentElement,max=h.scrollHeight-innerHeight;sprog.style.width=(max>0?scrollY/max*100:0)+'%';totop.classList.toggle('on',scrollY>700);topEl.classList.toggle('scrolled',scrollY>8);if(!RM)aur.style.transform=`translate3d(0,${(-scrollY*.18).toFixed(1)}px,0)`})};
addEventListener('scroll',onScroll,{passive:true});addEventListener('resize',onScroll);
const FINE=matchMedia('(hover:hover) and (pointer:fine)').matches;
document.addEventListener('pointermove',e=>{if(RM||!FINE)return;const t=e.target.closest&&e.target.closest('.ticket');document.querySelectorAll('.ticket.tilting').forEach(x=>{if(x!==t){x.classList.remove('tilting');x.style.transform=''}});if(!t)return;const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.classList.add('tilting');t.style.transform=`perspective(1200px) rotateX(${(-y*3).toFixed(2)}deg) rotateY(${(x*4).toFixed(2)}deg) translateY(-2px)`},{passive:true});
document.addEventListener('pointerleave',()=>document.querySelectorAll('.ticket.tilting').forEach(x=>{x.classList.remove('tilting');x.style.transform=''}));
document.addEventListener('pointerdown',e=>{if(RM)return;const b=e.target.closest&&e.target.closest('.btn,.seg button,.chip,.wc,.chb,.mjb,.tile,.mnav button');if(!b||b.disabled)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2.2,s=document.createElement('span');s.className='rp';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),650)},{passive:true});
async function shareSite(){const data={title:'לוח מבחנים י״ב',text:'כל המבחנים, הבגרויות ושבתות הישיבה של השכבה במקום אחד, עם תזכורות 📚',url:location.origin+'/'};
  if(navigator.share){try{await navigator.share(data);return}catch(e){if(e&&e.name==='AbortError')return}}
  open('https://wa.me/?text='+encodeURIComponent(data.text+'\n'+data.url),'_blank','noopener')}
$('#shareB').innerHTML=ICON.share;$('#shareB').onclick=shareSite;
$('#shareF').innerHTML=ICON.share+'שיתוף עם המחזור';$('#shareF').onclick=shareSite;
document.addEventListener('pointermove',e=>{const el=e.target.closest&&e.target.closest('.spot');if(!el)return;const r=el.getBoundingClientRect();el.style.setProperty('--mx',(e.clientX-r.left)+'px');el.style.setProperty('--my',(e.clientY-r.top)+'px')},{passive:true});
fetch('/days.json').then(r=>r.json()).then(d=>{DATA=d;if(S.cls!=='all'&&!CLASSES.includes(S.cls))S.cls='all';if(S.me)syncFromMe();route();setTimeout(()=>onboarding(false),400);
  if(S.token)api('/api/me?t='+encodeURIComponent(S.token)).then(j=>{S.me=j.sub;LS.set('yb.me',S.me);syncFromMe();updateNav()}).catch(()=>{});})
  .catch(()=>{app.innerHTML='<div class="empty">הלוח לא נטען. רעננו את הדף.</div>'});
})();
</script>
